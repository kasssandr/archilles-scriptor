[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archilles-scriptor"
version = "0.1.0"
description = "PDF -> Markdown for scholarly prose, with footnotes still attached to the right sentence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tom Rauchenwald" }]
dependencies = [
    "pymupdf>=1.24",
    "charset-normalizer>=3.0",
    "lxml>=5.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
scriptor = "scriptor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
