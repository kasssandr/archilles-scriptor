# Ground truth for mehr-themistios -- Mehr, Simone. Ganz Rhetor, ganz Philosoph: Themistios als Lobredner auf Valens. De Gruyter.
# Licence: CC-BY-NC-ND-4.0 (restricted)
#
# Author this against pages/pNNN.png, NOT against any converter output.
# pages/pNNN.txt holds the raw textlayer; copy definition text from there to
# save typing -- but read it back against the image. Extraction drops spaces,
# notably between words in Greek and other non-Latin passages, and a truth
# that copies such a defect measures the defect instead of the page.
#
# TWO DEFECTS OF THIS VOLUME'S TEXTLAYER, both measured:
#   * The numbers in the apparatus are not digits. De Gruyter's house font
#     sets them as private-use glyphs -- U+F131 U+F135 where the page prints
#     15 -- with no space after them: "Dagron, Travaux et mémoire".
#     Start definition_starts at the first letter and type `num` by hand.
#   * Greek runs together: "καὶἐῶμὲν Ὅμηρον" for "καὶ ἐῶμεν Ὅμηρον". Read
#     those passages off the image.
# The markers in the body are unaffected; they are ordinary digits stuck to
# the preceding word ("Terrorregime.1").
#
# Two kinds of page number are in play, and they are not interchangeable:
#   pNNN            the physical page in the PDF -- the file name
#   printed label   the number or numeral printed on that page -- the truth
# They frequently disagree. Read the label off the image; this file declares
# no catalogue entries at all, so every label below was read off the page.
#
# Per footnote, printed on the page:
#   page               the printed label, as a string
#   num                the number as printed -- page-local in some volumes,
#                      running through the whole book in others; copy what
#                      stands there, do not renumber
#   definition_starts  first ~15-40 characters of the note text
#   status             intact | marker_lost | damaged
#   anchor_after       text right before the marker in the body (optional,
#                      omit when the marker is destroyed and you cannot tell)
#
# When a note breaks off at the foot of the page and resumes on the next one,
# `page` stays the page it begins on and two more fields record the rest:
#   definition_ends    the last few words of the note, wherever it ends -- this
#                      is what makes it checkable whether a converter kept the
#                      note whole instead of only finding its opening. It is
#                      also what says a note this short was copied whole.
#   continues_on       printed label of the page that receives the remainder,
#                      i.e. the next page carrying text, which is not always
#                      the next page. That page has to be authored too.
# The continuation itself carries no number and gets no entry of its own.
#
# A selected page carrying no footnote at all goes into `empty_pages`.

volume = "mehr-themistios"
pages = [
  "6", "9", "28", "29", "35", "57", "62", "70", "163", "175", "183",
]
# p077 carries no apparatus at all. What stands at the foot of it, three lines
# set small, is the opening of a block quotation that runs on to the next page
# -- and this volume sets its quotations in the same 8.0pt as its notes. Only
# the indent tells them apart: a note sits on the margin of the type area, a
# quotation is indented by about 17 points. Type size alone cannot decide this
# page.
empty_pages = ["62"]

# Read off the running head, where this volume sets the folio at the outer
# margin. The printed number is the physical page less 15 throughout.
[physical_pages]
"6" = 21   # p021.png
"9" = 24   # p024.png -- replaces p041, a blank verso between chapters I and II
"28" = 43   # p043.png
"29" = 44   # p044.png -- receiving page: the tail of note 9 stands above its own notes 10-13
"35" = 50   # p050.png
"57" = 72   # p072.png
"62" = 77   # p077.png
"70" = 85   # p085.png
# p178 opens chapter V. De Gruyter sets no running head on a chapter opening,
# so this page prints no number at all; 163 is the count carried on silently,
# which is what a reader supplies too. The volume's only page whose label was
# not read but inferred -- deliberately kept, because a converter has to keep
# counting here rather than read.
"163" = 178   # p178.png
"175" = 190   # p190.png -- densest polytonic Greek in the volume (297 characters)
"183" = 198   # p198.png -- second densest polytonic passage (238 characters)

