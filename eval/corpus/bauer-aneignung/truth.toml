# Structural regions (spec §4.4), declared for the whole volume -- not for the
# pages sampled above. The footnote sample is drawn from body pages and holds
# no apparatus at all, so a recall measured over it would have an empty
# denominator. Each entry opens a region that runs until the next one.
#
# DRAFT, read off two sources independent of any converter output: the
# publisher's PDF outline (Literaturverzeichnis -> physical 325) and the raw
# text layer of the front and back matter. Operator to confirm against the
# page images.
#
# The volume prints no folio before physical 7, so the four cover and imprint
# pages carry no label a boundary could name; they stay outside the measured
# range rather than being guessed at.
[[regions]]
from_page = "7"     # "Vorwort" -- first page carrying a printed folio. It
                    # reports how the dissertation came about and thanks the
                    # supervisors, and is printed ahead of the table of
                    # contents: front matter, not an introduction that leads
                    # into the argument. Operator confirmed 2026-08-12.
